<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ankara Anadolu Geri Dönüşümcüleri İhtisas OSB - Parsel Sorgulama Sistemi</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      height: 100%;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background: #eef2f6;
      color: #1e293b;
      overflow: hidden;
    }

    /* GİRİŞ EKRANI (ŞİFRE KORUMASI) */
    #loginOverlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .login-card img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin: 0 auto 14px;
      display: block;
    }
    .login-card h2 {
      font-size: 16.5px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.35;
      margin-bottom: 4px;
    }
    .login-card p {
      font-size: 12.5px;
      color: #64748b;
      margin-bottom: 22px;
    }
    .login-field {
      text-align: left;
      margin-bottom: 14px;
    }
    .login-field label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 6px;
    }
    .login-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .login-field input:focus {
      border-color: #1d4ed8;
    }
    .btn-login-submit {
      width: 100%;
      padding: 11px;
      background: #1e3a8a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-login-submit:hover {
      background: #1d4ed8;
    }
    .login-error {
      color: #dc2626;
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 10px;
      min-height: 18px;
    }

  </style>
</head>
<body>

  const SESSION_KEY = "agdosb_tahsis_k";

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(password) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw",
      enc.encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: b64ToBytes(ENC_SALT),
        iterations: PBKDF2_ITERS,
        hash: "SHA-256"
      },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function decryptAndMount(password) {
    const cryptoKey = await deriveKey(password);
    const decryptedBuf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(ENC_IV) },
      cryptoKey,
      b64ToBytes(ENC_DATA)
    );
    const decoded = JSON.parse(new TextDecoder("utf-8").decode(decryptedBuf));
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("appRoot").innerHTML = decoded.dom;

    // Uygulama kodunu dinamik olarak çalıştır
    const runApp = new Function(decoded.js);
    runApp();
  }

  window.handleLogin = async function(e) {
    e.preventDefault();
    const pwdInput = document.getElementById("pwdInput");
    const errEl = document.getElementById("loginError");
    const btn = e.target.querySelector("button[type='submit']");
    const pwd = pwdInput.value;

    errEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "DOĞRULANIYOR...";

    try {
      await decryptAndMount(pwd);
      sessionStorage.setItem(SESSION_KEY, pwd);
    } catch (err) {
      errEl.textContent = "Hatalı şifre! Lütfen tekrar deneyiniz.";
      pwdInput.value = "";
      pwdInput.focus();
    } finally {
      btn.disabled = false;
      btn.textContent = "GİRİŞ YAP";
    }
  };

  window.logoutSystem = function() {
    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  };

  // Aktif oturum varsa otomatik çöz
  const savedPwd = sessionStorage.getItem(SESSION_KEY);
  if (savedPwd) {
    decryptAndMount(savedPwd).catch(() => {
      sessionStorage.removeItem(SESSION_KEY);
    });
  }
})();
